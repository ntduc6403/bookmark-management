basePath: /
definitions:
  handler.HealthCheckResponse:
    properties:
      instance_id:
        type: string
      message:
        type: string
      service_name:
        type: string
    type: object
  handler.ShortenURLRequest:
    properties:
      exp:
        type: integer
      url:
        type: string
    required:
    - url
    type: object
  handler.ShortenURLResponse:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
host: localhost:8080
info:
  contact: {}
  description: API documentation for the Bookmark  service.
  title: Bookmark API
  version: "1.0"
paths:
  /health-check:
    get:
      description: Returns the health status of the service, including service name
        and instance ID.
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.HealthCheckResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: HealthCheck endpoint
      tags:
      - HealthCheck
  /v1/links/shorten:
    post:
      consumes:
      - application/json
      description: Shortens a given URL with an optional expiration time in seconds.
      parameters:
      - description: Shorten URL request payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/handler.ShortenURLRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handler.ShortenURLResponse'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Shorten URL
      tags:
      - Links
swagger: "2.0"
